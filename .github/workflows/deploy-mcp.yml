name: Deploy MCP server

# Merging a change to supabase/functions/ deploys the MCP server Claude connects to. App releases are separate.
# Setup and rules are in docs/agents/releasing.md.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy brewprint-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first. See docs/agents/releasing.md."; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      # verify_jwt = false comes from supabase/config.toml; the function checks tokens itself.
      - name: Deploy
        run: supabase functions deploy brewprint-mcp --project-ref ftwdmparhchrafsbmplv --use-api
