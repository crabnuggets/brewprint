name: Release

# Push a tag such as v0.2.0 to build a signed APK and publish it as a GitHub Release.
# The rules for choosing and tagging a version are in docs/agents/releasing.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main's history and every tag, for the checks below

      - name: Check the tag
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::$tag should look like v1.2.3 or v1.2.3-beta.1. See docs/agents/releasing.md."; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$tag must point at a commit on main. Merge first, then tag main."; exit 1
          fi
          # "~" sorts before the end of a version, so v1.2.0-beta.1 comes before v1.2.0.
          key() { echo "${1/-/\~}"; }
          newest=$(git tag -l 'v*' | grep -vx "$tag" | while read -r t; do key "$t"; done | sort -V | tail -1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$(key "$tag")" | sort -V | tail -1)" != "$(key "$tag")" ]; then
            echo "::error::$tag must be higher than the newest release tag, ${newest/\~/-}."; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the KEYSTORE_BASE64 secret first."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          BREWPRINT_KEYSTORE: ${{ runner.temp }}/release.jks
          BREWPRINT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BREWPRINT_VERSION_CODE: ${{ github.run_number }}
        run: BREWPRINT_VERSION="${GITHUB_REF_NAME#v}" ./gradlew assembleRelease --console=plain

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "brewprint-${GITHUB_REF_NAME}.apk"
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" "brewprint-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
